[package]
name    = "binmodemffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# rlib beside staticlib so the integration tests in tests/ can link against
# the same crate; C builds keep using target/release/libbinmodemffi.a.
crate-type = ["staticlib", "rlib"]

[dependencies]
datapump = { path = "../datapump" }
v8       = { path = "../v8" }
dsp      = { path = "../dsp" }
ec       = { path = "../ec" }

# Not workspace = true: the workspace denies unsafe_code, and the C boundary
# below is exactly what that would forbid.
[lints.rust]
unsafe_code = "allow"
